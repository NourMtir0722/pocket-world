<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pocket World</title>
  <meta name="description" content="Six little worlds on one cube. No images, no models: every texture and shape is made by code when the page opens." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,600&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1c262d; }
    canvas { display: block; }
    #vignette { position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(8,12,16,.55) 100%); }
    #label { position: fixed; left: 28px; bottom: 24px; color: #e9e2d2; font-family: Fraunces, Georgia, serif;
      font-style: italic; pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,.4); }
    #label b { display: block; font-size: 26px; font-weight: 600; letter-spacing: .01em; }
    #label span { font-size: 14px; opacity: .7; }
    #hint { position: fixed; right: 28px; bottom: 26px; color: #e9e2d2; opacity: .5; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; pointer-events: none; }
    body.clean #label, body.clean #hint { display: none; }
    @media (max-width: 600px) { #label { left: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); } #label b { font-size: 21px; } #hint { display: none; } }
    html.embed #label, html.embed #hint { display: none; }
  </style>
</head>
<body>
  <div id="vignette"></div>
  <div id="label"><b>Pocket World</b><span>six little worlds on one cube</span></div>
  <div id="hint">drag to look around · space to pause · H hides text</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { send, onCommand, faceWeights, makeDirector } from './shared/bridge.js';
import { Tour, fitFov } from './shared/tour.js';
import { makePanel, readShared, hashSeed } from './shared/knobs.js';
import { addHero } from './shared/hero.js';

// ---------- basics ----------
const params = new URLSearchParams(location.search);
if (params.has('clean')) document.body.classList.add('clean');
let seed = 7;
function rng() { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const rr = (a, b) => a + (b - a) * rng();
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const Y = V(0, 1, 0);
const put = (m, p) => (m.position.copy(p), m);

const H = 3;          // half size of the cube
const T = 1024;       // texture size
let riverZ = (x) => 0.35 + 0.45 * Math.sin(x * 0.8 + 0.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1e2a31');
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
// tall screens get a wider view so the whole cube fits (during a flight the tour keeps it fitted)
let flight = null;   // the tour, once it exists
function fitCamera() { const f = fitFov(32, camera.aspect); if (flight?.active) flight.fov0 = f; else camera.fov = f; camera.updateProjectionMatrix(); }
fitCamera();
camera.position.set(14, 9.2, 15);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 11; controls.maxDistance = 32;
controls.target.set(0, -0.2, 0);

const hemi = new THREE.HemisphereLight('#e6eef2', '#3b3a48', 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff0d8', 2.6);
sun.position.set(7, 11, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -7.5, right: 7.5, top: 7.5, bottom: -7.5, near: 1, far: 30 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);
const fill = new THREE.DirectionalLight('#9fb6d8', 0.7);
fill.position.set(-8, 2, -4);
scene.add(fill);
const moon = new THREE.DirectionalLight('#9db4ff', 0);
moon.shadow.mapSize.set(1024, 1024);
Object.assign(moon.shadow.camera, { left: -7.5, right: 7.5, top: 7.5, bottom: -7.5, near: 1, far: 30 });
moon.shadow.bias = -0.0004; moon.shadow.normalBias = 0.02;
scene.add(moon);
// a sky of stars that only shows at night
const stars = (() => {
  const n = 1400, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = 45; const s2 = Math.sqrt(1 - u * u);
    pos.set([Math.cos(a) * s2 * r, u * r, Math.sin(a) * s2 * r], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ color: '#ffffff', size: 0.14, transparent: true, opacity: 0, depthWrite: false });
  const p = new THREE.Points(g, m); scene.add(p); return p;
})();
// what glows after dark; refilled on every rebuild
const NIGHT = { windows: new Set(), lamps: [], lanterns: new Set(), fireflies: null };

const world = new THREE.Group();
world.rotation.y = Number(params.get('rot') ?? 0.12);
scene.add(world);
const updaters = [];

// ---------- materials & helpers ----------
const matCache = new Map();
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85, ...opts }));
  return matCache.get(key);
}
function mesh(geo, material, cast = true) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = cast; m.receiveShadow = true;
  return m;
}
const FACES = {
  pz: { n: V(0, 0, 1), r: V(1, 0, 0) },
  px: { n: V(1, 0, 0), r: V(0, 0, -1) },
  nz: { n: V(0, 0, -1), r: V(-1, 0, 0) },
  nx: { n: V(-1, 0, 0), r: V(0, 0, 1) },
};
// a, b are face coordinates in [-H, H]: a to the right, b up. h lifts off the face.
function facePos(f, a, b, h = 0) {
  const F = FACES[f];
  return F.n.clone().multiplyScalar(H + h).addScaledVector(F.r, a).add(V(0, b, 0));
}
// stand an object on a side face: its local +Y points out of the face
function placeOut(obj, f, a, b, spin = 0, h = 0) {
  obj.position.copy(facePos(f, a, b, h));
  obj.quaternion.setFromUnitVectors(Y, FACES[f].n);
  obj.rotateY(spin);
  world.add(obj);
  return obj;
}
// canvas coordinates for a side face / for the top
const fx = (a) => (a + H) / (2 * H) * T, fy = (b) => (H - b) / (2 * H) * T;
const tx = (x) => (x + H) / (2 * H) * T, tz = (z) => (z + H) / (2 * H) * T;

function paint(draw) {
  const c = document.createElement('canvas'); c.width = c.height = T;
  const g = c.getContext('2d'); g.lineCap = 'round'; g.lineJoin = 'round';
  draw(g);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return tex;
}
function blob(g, x, y, r, color, alpha = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, color); gr.addColorStop(1, color + '00');
  g.globalAlpha = alpha; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
}
function dot(g, x, y, rx, ry, color, alpha = 1, rot = 0) {
  g.globalAlpha = alpha; g.fillStyle = color; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
}
function dashes(g, n, colors, len, width, alpha, area = [0, 0, T, T], angle = null) {
  g.lineWidth = width;
  for (let i = 0; i < n; i++) {
    const x = rr(area[0], area[0] + area[2]), y = rr(area[1], area[1] + area[3]);
    const a = angle ?? rr(-Math.PI, Math.PI), l = rr(len * 0.5, len);
    g.globalAlpha = alpha; g.strokeStyle = pick(colors);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  g.globalAlpha = 1;
}
function grassLip(g, color = '#7f8f45', dark = '#5d6a34') {
  g.fillStyle = dark; g.fillRect(0, 0, T, 26);
  g.fillStyle = color; g.fillRect(0, 0, T, 16);
  for (let x = 0; x < T; x += 14) { g.beginPath(); g.arc(x + rr(0, 8), 18, rr(6, 11), 0, Math.PI); g.fill(); }
}

// ---------- the seasons ----------
const SEASONS = {
  autumn: { leaves: ['#e8803a', '#f0a040', '#d8553a', '#f3c35a', '#efe2c0', '#c9643a'], pine: '#3f6b4f', grass: '#86934a', blobs: ['#93a052', '#76843f', '#a3a55c', '#6d7a3a'],
    strokes: ['#6c7a38', '#a2a862', '#5c6a30', '#b8b373'], fallen: ['#e0823c', '#e9a94b', '#c95a35', '#efd27a'], lip: ['#7f8f45', '#5d6a34'], bushes: ['#e3a243', '#b9b45a', '#d06a3a', '#8b8f86'], falling: ['#e8803a', '#f0a040', '#d8553a', '#f3c35a', '#c9643a'] },
  summer: { leaves: ['#5e9b4a', '#6fae52', '#4f8a43', '#82b85c', '#3f7a3c'], pine: '#2f6145', grass: '#7aa84a', blobs: ['#8cbc58', '#6e9e42', '#9cc666', '#5f8f3a'],
    strokes: ['#5f8f35', '#a5cc70', '#4e7f2e', '#b9d98a'], fallen: ['#f2d14a', '#ffffff', '#e57aa0', '#b48ce0'], lip: ['#76a84a', '#557c34'], bushes: ['#5f9a45', '#e57aa0', '#f2d14a', '#8b8f86'], falling: ['#ffffff', '#f2d14a', '#e57aa0'] },
  spring: { leaves: ['#f4b6c8', '#f7cfda', '#fdf3f6', '#e99ab4', '#a8d08a'], pine: '#3f7350', grass: '#93bd62', blobs: ['#a4cc72', '#83b056', '#b3d684', '#7aa64e'],
    strokes: ['#76a548', '#bfe08f', '#6a9a40', '#cde8a0'], fallen: ['#f7cfda', '#ffffff', '#f4b6c8', '#f2d14a'], lip: ['#8bbb5a', '#64913f'], bushes: ['#f4b6c8', '#a8d08a', '#ffffff', '#e99ab4'], falling: ['#f7cfda', '#f4b6c8', '#ffffff'] },
  winter: { leaves: ['#e8eef2', '#d6e2ea', '#f4f8fa', '#c9d8e2'], pine: '#2f5a48', grass: '#e4ebf0', blobs: ['#dde6ec', '#f6f9fb', '#cfdbe4', '#eef3f6'],
    strokes: ['#c7d4de', '#ffffff', '#b8c8d4', '#e1e9ef'], fallen: ['#ffffff', '#dfe8ef', '#cfdbe4'], lip: ['#eef3f6', '#c9d6df'], bushes: ['#e9eef2', '#c9d8e2', '#8b8f86'], falling: ['#ffffff', '#f4f8fb', '#e6eef4'] },
};

// ---------- build the whole world from the knobs; called again whenever a shape knob changes ----------
function disposeWorld() {
  world.traverse((o) => {
    o.geometry?.dispose();
    (Array.isArray(o.material) ? o.material : o.material ? [o.material] : []).forEach((m) => { m.map?.dispose(); m.dispose(); });
  });
  world.clear(); matCache.clear(); updaters.length = 0;
  NIGHT.windows.clear(); NIGHT.lamps.length = 0; NIGHT.lanterns.clear(); NIGHT.fireflies = null;
}
let SIDES = {};
function buildWorld(P) {
disposeWorld();
seed = hashSeed(P.seed);
const S = SEASONS[P.season];
const bend = P.riverBend;
riverZ = (x) => 0.35 + bend * Math.sin(x * 0.8 + 0.5);
SIDES = { pz: P.front, px: P.right, nz: P.back, nx: P.left };
// ---------- the six painted faces ----------
const RIGHT_FALL_A = -riverZ(H);   // where the river meets the pond face (face coord a = -z)
const LEFT_FALL_A = riverZ(-H);    // where it meets the canyon face (face coord a = z)

const texTop = paint((g) => {
  g.fillStyle = S.grass; g.fillRect(0, 0, T, T);
  for (let i = 0; i < 70; i++) blob(g, rr(0, T), rr(0, T), rr(40, 170), pick(S.blobs), 0.5);
  dashes(g, 5200, S.strokes, 13, 2, 0.5, undefined, -Math.PI / 2 + 0.3);
  for (let i = 0; i < 700; i++) dot(g, rr(0, T), rr(0, T), rr(2, 4.5), rr(1.5, 3), pick(S.fallen), 0.85, rr(0, 3));
  // path from the cabin door to the bridge
  g.strokeStyle = '#9c8656'; g.lineWidth = 40;
  const path = () => { g.beginPath(); g.moveTo(tx(-0.4), tz(-0.95)); g.bezierCurveTo(tx(-0.3), tz(-0.4), tx(0.35), tz(-0.5), tx(0.3), tz(0.15)); g.stroke(); };
  path(); g.strokeStyle = '#bea672'; g.lineWidth = 26; path();
  dashes(g, 160, ['#8d7a50', '#d4c08e'], 8, 2, 0.6, [tx(-0.6), tz(-1), tx(0.5) - tx(-0.6), tz(0.2) - tz(-1)]);
  if (P.river) {
  const river = (w, c) => { g.strokeStyle = c; g.lineWidth = w; g.beginPath();
    for (let x = -H - 0.3; x <= H + 0.3; x += 0.05) { const p = [tx(x), tz(riverZ(x))]; x === -H - 0.3 ? g.moveTo(...p) : g.lineTo(...p); } g.stroke(); };
  river(96, '#5d5a35'); river(74, '#4a7782'); river(50, '#5f8f9b'); river(18, '#79a8b0');
  for (let i = 0; i < 140; i++) { const x = rr(-H, H), z = riverZ(x) + rr(-0.12, 0.12);
    g.globalAlpha = 0.75; g.strokeStyle = '#d6e8e2'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(tx(x), tz(z)); g.lineTo(tx(x + 0.07), tz(z)); g.stroke(); }
  g.globalAlpha = 1;
  }
});

const texOcean = (fallA) => paint((g) => {
  const gr = g.createLinearGradient(0, 0, 0, T);
  gr.addColorStop(0, '#a6c0a6'); gr.addColorStop(0.45, '#73a197'); gr.addColorStop(1, '#456f6d');
  g.fillStyle = gr; g.fillRect(0, 0, T, T);
  for (let i = 0; i < 7; i++) { const x = rr(0, T); g.globalAlpha = 0.07; g.fillStyle = '#ffffff';
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 60, 0); g.lineTo(x + 260, T * 0.85); g.lineTo(x + 140, T * 0.85); g.fill(); }
  g.globalAlpha = 1;
  // a far-away whale, only a shadow
  g.globalAlpha = 0.22; g.fillStyle = '#2f5856';
  g.beginPath(); g.ellipse(T * 0.38, T * 0.5, 210, 58, -0.05, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.moveTo(T * 0.18, T * 0.5); g.lineTo(T * 0.07, T * 0.42); g.lineTo(T * 0.1, T * 0.5); g.lineTo(T * 0.07, T * 0.58); g.fill();
  g.beginPath(); g.ellipse(T * 0.42, T * 0.56, 60, 14, 0.5, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;
  for (let i = 0; i < 30; i++) dot(g, T * 0.62 + rr(0, 200), T * 0.3 + rr(0, 80), 6, 2.5, '#335f5c', 0.35);
  dashes(g, 420, ['#dcebe2', '#bcd6cc'], 18, 3, 0.35, [0, 40, T, T * 0.75], 0);
  // kelp
  for (let i = 0; i < 12; i++) {
    let x = rr(0, T), y = T * 0.86; const h = rr(150, 420);
    g.strokeStyle = pick(['#4d7a4c', '#5f8a4f', '#3f6845']); g.lineWidth = rr(6, 11);
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 6; k++) { const ny = y - h / 6; g.quadraticCurveTo(x + rr(-30, 30), y - h / 12, x + rr(-10, 10), ny); y = ny; }
    g.stroke();
  }
  // sand
  g.fillStyle = '#c7b386'; g.beginPath(); g.moveTo(0, T);
  for (let x = 0; x <= T; x += 16) g.lineTo(x, T * 0.84 + Math.sin(x * 0.012) * 22 + Math.sin(x * 0.041) * 6);
  g.lineTo(T, T); g.fill();
  for (let i = 0; i < 500; i++) dot(g, rr(0, T), rr(T * 0.86, T), rr(1.5, 5), rr(1.5, 4), pick(['#a89468', '#8f8a7f', '#ddd0a8']), 0.8);
  for (let i = 0; i < 40; i++) dot(g, rr(0, T), rr(40, T * 0.8), rr(3, 6), rr(3, 6), '#e6f2ec', 0.25);
  grassLip(g, S.lip[0], S.lip[1]);
  g.strokeStyle = '#e4f0e8'; g.lineWidth = 3; g.globalAlpha = 0.6; g.setLineDash([24, 18]);
  g.beginPath(); g.moveTo(0, 34); g.lineTo(T, 34); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
});

const texPond = (fallA) => paint((g) => {
  const gr = g.createLinearGradient(0, 0, 0, T);
  gr.addColorStop(0, '#6a957c'); gr.addColorStop(1, '#2e5554');
  g.fillStyle = gr; g.fillRect(0, 0, T, T);
  for (let i = 0; i < 40; i++) blob(g, rr(0, T), rr(0, T), rr(60, 160), pick(['#3f6c63', '#78a184']), 0.35);
  for (let i = 0; i < 26; i++) { const x = rr(0, T), y = rr(60, T), r = rr(20, 60);
    g.strokeStyle = '#b4d2c0'; g.globalAlpha = 0.22; g.lineWidth = 2;
    for (let k = 0; k < 3; k++) { g.beginPath(); g.ellipse(x, y, r + k * 14, (r + k * 14) * 0.45, 0, 0, Math.PI * 2); g.stroke(); } }
  g.globalAlpha = 1;
  for (let i = 0; i < 30; i++) { const x = rr(0, T), y = rr(80, T), r = rr(14, 34);
    g.fillStyle = pick(['#5f8f58', '#6d9a62', '#4f7e4e']); g.beginPath(); g.moveTo(x, y); g.arc(x, y, r, 0.3, Math.PI * 2 - 0.1); g.fill();
    dot(g, x - r * 0.2, y - r * 0.2, r * 0.4, r * 0.3, '#9cc28a', 0.35);
    if (rng() < 0.3) dot(g, x + rr(-5, 5), y + rr(-5, 5), 5, 5, '#f2a9c3', 0.95); }
  if (fallA !== null) dot(g, fx(fallA), fy(0.6), 70, 22, '#d8ece4', 0.6);
  grassLip(g, S.lip[0], S.lip[1]);
});

const texNight = (fallA) => paint((g) => {
  const gr = g.createLinearGradient(0, 0, 0, T);
  gr.addColorStop(0, '#2a3460'); gr.addColorStop(1, '#0f1530');
  g.fillStyle = gr; g.fillRect(0, 0, T, T);
  for (let i = 0; i < 360; i++) dot(g, rr(0, T), rr(30, T), rr(0.8, 2.4), rr(0.8, 2.4), '#ffffff', rr(0.25, 0.9));
  for (let i = 0; i < 8; i++) { const x = rr(0, T), y = rr(60, T), s = rr(4, 7);
    g.globalAlpha = 0.9; g.fillStyle = '#fff6d8'; g.beginPath();
    for (let k = 0; k < 8; k++) { const r = k % 2 ? s * 0.35 : s * 1.6, a = k * Math.PI / 4; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.fill(); }
  g.globalAlpha = 1;
  // crescent moon
  dot(g, T * 0.72, T * 0.24, 62, 62, '#f6edc8'); dot(g, T * 0.72 + 26, T * 0.24 - 14, 58, 58, '#283260');
  blob(g, T * 0.72, T * 0.24, 160, '#f6edc8', 0.12);
  [[0.25, 0.7, '#6fe0ff'], [0.62, 0.78, '#b585ff'], [0.4, 0.42, '#6fe0ff']].forEach(([x, y, c]) => blob(g, x * T, y * T, 190, c, 0.28));
  grassLip(g, '#55663c', '#3c4a2c');
});

const texCanyon = (fallA) => paint((g) => {
  const bands = ['#d9a066', '#c7834f', '#e6b884', '#b5653f', '#d48d58', '#a85a3a', '#e0ab72', '#bf7448'];
  let y = 0, i = 0;
  const ph = rr(0, 6);
  while (y < T + 80) {
    const h = rr(28, 80); g.fillStyle = bands[i++ % bands.length];
    g.beginPath(); g.moveTo(0, T);
    for (let x = 0; x <= T; x += 16) g.lineTo(x, y + Math.sin(x * 0.006 + ph + i) * 18 + Math.sin(x * 0.03 + i) * 4);
    g.lineTo(T, T); g.fill(); y += h;

  sun.castShadow = up > 0.15; moon.castShadow = !sun.castShadow;
  sun.shadow.radius = moon.shadow.radius = P.softness;
  hemi.color.copy(lerpC('#5a6cb0', '#e6eef2', up)).lerp(new THREE.Color('#f0b090'), (1 - Math.abs(elev * 2 - 0.3)) * 0.25 * up);
  hemi.groundColor.copy(lerpC('#262a44', '#3b3a48', up));
  hemi.intensity = 0.7 + 0.4 * up;
  fill.intensity = 0.3 + 0.4 * up;
  scene.background.copy(skyAt(h));
  stars.material.opacity = nightLevel * 0.9;
  renderer.toneMappingExposure = P.exposure * (0.92 + 0.08 * up);
  bloom.strength = P.glow * (1 + nightLevel * 0.8);
  NIGHT.windows.forEach((m) => (m.emissiveIntensity = 0.5 + 2.6 * nightLevel));
  NIGHT.lanterns.forEach((m) => (m.emissiveIntensity = 0.15 + 3 * nightLevel));
  NIGHT.lamps.forEach((l) => (l.intensity = 2.2 * nightLevel));
  if (NIGHT.fireflies) NIGHT.fireflies.material.opacity = nightLevel * 0.95;
}

let rebuildTimer = 0;
const panel = makePanel({ schema: SCHEMA, values: P, page: 'lowpoly', onChange: (k, v) => {
  P[k.key] = v;
  if (k.live) { applyLight(); return; }
  clearTimeout(rebuildTimer); rebuildTimer = setTimeout(() => { buildWorld(P); applyLight(); }, 120);
}, onToggle: (open) => send('panel', { open }) });
// the hub's toolbar drives the panel and the night switch
const isNight = () => { const h = P.hour % 24; return h < 6.2 || h > 19.2; };
onCommand((c) => {
  if (c.cmd === 'panel') panel.toggle();
  if (c.cmd === 'cam') director.go(c);
  if (c.cmd === 'night') { P.cycle = false; panel.set('cycle', false); P.hour = (c.value ?? !isNight()) ? 22 : 15.5; panel.set('hour', P.hour); applyLight(); send('light', { night: isNight() }); }
});
const hero = addHero({ camera, scene, text: 'Pocket World', brightness: 0.82 });
const director = makeDirector();
send('caps', { panel: true, night: true }); send('light', { night: isNight() });

const tour = new Tour({ camera, controls, space: world, duration: 32, points: tourPoints(), targets: tourTargets(),
  onProgress: (u) => { if (!tour.splashed && u > 0.5) { tour.splashed = true; send('sfx', { name: 'splash' }); } },
  onEnd: () => send('tour', { active: false }) });
flight = tour;
onCommand((c) => {
  if (c.cmd !== 'tour') return;
  if (tour.active) tour.stop();
  else { tour.splashed = false; tour.duration = c.duration || 32; tour.points = tourPoints(); tour.targets = tourTargets(); tour.start(); if (c.from) tour.t = c.from; send('tour', { active: true }); send('sfx', { name: 'whoosh' }); }
});
let mixTimer = 0;
function reportMix(dt) {
  if ((mixTimer += dt) < 0.12) return; mixTimer = 0;
  const local = world.worldToLocal(camera.position.clone()), f = faceWeights(local, H);
  const onRiver = local.y > H - 0.3 && Math.abs(local.x) < H ? Math.max(0, 1 - Math.abs(local.z - riverZ(local.x)) / 1.6) : 0;
  const fall = Math.max(0, 1 - local.distanceTo(P3(H, 1.8, riverZ(H))) / 3);
  const side = { front: P.front, right: P.right, back: P.back, left: P.left }, w = { ocean: 0, pond: 0, night: 0, canyon: 0 };
  for (const [k, b] of Object.entries(side)) w[b] = Math.max(w[b], f[k] * f.near);
  send('mix', { birds: Math.min(1, f.top * f.near * 1.4) * (1 - nightLevel * 0.85), wind: 0.25 + w.canyon * 0.7 + (1 - f.near) * 0.3 + (P.season === 'winter' ? 0.25 : 0),
    water: Math.min(1, Math.max(w.pond, P.river ? Math.max(onRiver, fall) : 0)), sea: w.ocean, night: Math.max(w.night, nightLevel * 0.8 * f.near) });
}
send('theme', { theme: 'lowpoly' });
let paused = false;
addEventListener('keydown', (e) => {
  if (e.code === 'Space') paused = !paused;
  if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean');
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; fitCamera();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let lightTick = 0;
let t = Number(params.get('t') || 0);
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) { t += dt; if (!tour.active) world.rotation.y += dt * P.spin; }
  if (P.cycle && !paused) { P.hour = (P.hour + dt * P.cycleSpeed) % 24; if ((lightTick += dt) > 0.25) { lightTick = 0; panel.set('hour', +P.hour.toFixed(2)); } }
  applyLight();
  world.position.y = Math.sin(t * 0.5) * 0.08;
  for (const u of updaters) u(t, paused ? 0 : dt);
  hero.object.visible = !tour.active;
  if (tour.active) tour.update(dt); else { director.update(dt, camera, controls.target); controls.update(); }
  reportMix(dt);
  composer.render();
  requestAnimationFrame(frame);
}
frame();
window.__pocket = { renderer, scene, world, camera };
</script>
</body>
</html>

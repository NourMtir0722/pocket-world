// ---------- shapes in picture coordinates (u to the right, v up the picture) ----------

const circle = (x, y, r, n = 48) => poly(Array.from({ length: n }, (_, i) => [x + Math.cos(i / n * Math.PI * 2) * r, y + Math.sin(i / n * Math.PI * 2) * r]));

    mat = [material('paper', color, glow), edgeMat];

  const m = new THREE.Mesh(geo, mat);
  m.position.y = lift * (mode === 'paper' ? K.depth : 0.62); m.castShadow = m.receiveShadow = true;

function picture(mode, n, build) {

const peaks = (mode) => picture(mode, 2, (L, g, real) => {
  L(frame(), '#f3e4c8', 0.005);
  sunDisc(L, g, real, -0.8, 0.9, 0.42, '#f2b36a');

// paper: folded 7s · unfold 2.5s · flat 4s · fold 2.5s
const CYCLE = MODE === 'real' ? 26 : 16;

  const fold = c < 17 ? 1 : c < 19.5 ? 1 - (c - 17) / 2.5 : c < 23 ? 0 : c < 25.5 ? (c - 23) / 2.5 : 1;

  LAMPS.forEach((l) => (l.intensity = 1.6 * st.night));
}
const isNight = () => { const h = ((K.hour % 24) + 24) % 24; return h < 6.2 || h > 19.2; };

// ---------- the hero title behind the cube ----------
const hero = addHero({ camera, scene, text: 'Pocket World', sub: MODE === 'paper' ? 'a world cut from paper' : 'paper first, then real', brightness: 0.9 });

// ---------- fly through the meadow, then down to the sea and round to the desert ----------
const P3 = (x, y, z) => new THREE.Vector3(x, y, z);
const TOUR_POINTS = [P3(0, 0, 0), P3(-2.4, 3.4, -2.6), P3(-1.7, 2.45, -0.9), P3(-0.9, 2.32, -rz(-0.9)), P3(0.3, 2.32, -rz(0.3)), P3(1.2, 2.4, 0.2), P3(1.5, 2.8, 2.0),
  P3(0.6, 1.0, 3.6), P3(-0.6, 0.0, 3.1), P3(-2.9, 0.2, 2.9), P3(-3.5, 0.4, 0.2), P3(-7, 5, 9)];
const TOUR_TARGETS = [P3(0, 0, 0), P3(-0.75, 2.1, 0.75), P3(-0.4, 2.15, 0.9), P3(0.3, 2.1, -rz(0.3)), P3(1.15, 2.3, 1.05), P3(1.15, 2.35, 1.05), P3(0.2, 0.9, 2.0),
  P3(-0.5, 0.1, 2.0), P3(-0.5, -0.4, 2.0), P3(-2.0, 0.0, 0.8), P3(-2.0, -0.3, 0), P3(0, 0, 0)];
const space = () => (RR || PR).rig;
const director = makeDirector({ keepDist: true });
const tour = new Tour({ camera, controls, space: space(), duration: 30, points: TOUR_POINTS, targets: TOUR_TARGETS, onEnd: () => send('tour', { active: false }) });
flight = tour;

// ---------- the panel and the hub ----------
let rebuildTimer = 0;
const panel = makePanel({ schema: SCHEMA, values: K, page: MODE === 'paper' ? 'paper' : 'transform', onChange: (k, v) => {
  K[k.key] = v;
  if (k.key === 'autoplay') { auto = v; if (!v) { goalReal = real; goalFold = fold; } }
  if (k.live) { applyLight(); return; }
  clearTimeout(rebuildTimer); rebuildTimer = setTimeout(() => { rebuild(); applyLight(); }, 120);
}, onToggle: (open) => send('panel', { open }) });
onCommand((c) => {
  if (c.cmd === 'cam') director.go(c);
  if (c.cmd === 'real' && RR) { auto = false; goalFold = 1; goalReal = c.value ? 1 : 0; }
  if (c.cmd === 'tour') { if (tour.active) tour.stop(); else { tour.duration = c.duration || 30; tour.space = space(); tour.start(); if (c.from) tour.t = c.from; send('tour', { active: true }); send('sfx', { name: 'whoosh' }); } }
  if (c.cmd === 'panel') panel.toggle();
  if (c.cmd === 'night') { K.cycle = false; panel.set('cycle', false); K.hour = (c.value ?? !isNight()) ? 22 : 14; panel.set('hour', K.hour); applyLight(); send('light', { night: isNight() }); }
});
send('theme', { theme: MODE === 'paper' ? 'paper' : 'transform' });
send('caps', { panel: true, night: true }); send('light', { night: isNight() });

function reportFaces() {
  const f = faceWeights(space().worldToLocal(camera.position.clone()), H), w = { sea: 0, peaks: 0, night: 0, desert: 0, under: 0 };
  for (const k of ['front', 'right', 'back', 'left']) w[K[k]] = Math.max(w[K[k]], f[k] * f.near);
  send('mix', { birds: Math.min(1, (f.top * f.near + w.peaks * 0.5) * 1.3) * (1 - day.state.night * 0.85), wind: 0.2 + (w.desert + w.peaks * 0.6) * 0.7 + (1 - f.near) * 0.3,
    water: 0, sea: w.sea, night: Math.max(w.night, day.state.night * 0.8 * f.near) });
}

// ---------- loop ----------
let mixTimer = 0, lastFold = null, lastReal = null, lightTick = 0;
const TOP = H + 1.0, BOTTOM = -H - 0.6;
const clock = new THREE.Clock(); let t = Number(params.get('t') || 0);
let rot = Number(params.get('rot') ?? 0.35);
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused && !tour.active) { t += dt; rot += dt * K.spin; }
  if (K.cycle && !paused) { K.hour = (K.hour + dt * K.cycleSpeed) % 24; if ((lightTick += dt) > 0.25) { lightTick = 0; panel.set('hour', +K.hour.toFixed(2)); } }
  applyLight();
  if (tour.active) { fold += (1 - fold) * Math.min(1, dt * 3); if (RR && fold > 0.999) real += (1 - real) * Math.min(1, dt * 1.5); }
  else if (auto) ({ realness: real, fold } = timeline(t));
  else {
    real += (goalReal - real) * Math.min(1, dt * 1.6);
    if (Math.abs(goalReal - real) < 0.002) real = goalReal;
    const wantFold = real > 0.001 ? 1 : goalFold;
    fold += (wantFold - fold) * Math.min(1, dt * 2.2);
  }
  if (!RR) real = 0;
  const r = ease(real);
  const cut = real <= 0.0005 ? 100 : real >= 0.9995 ? -100 : TOP + (BOTTOM - TOP) * r;
  paperCut.constant = cut; realCut.constant = -cut;
  PR.rig.visible = real < 0.9995;
  if (RR) { RR.rig.visible = real > 0.0005; RR.rig.rotation.y = rot; }
  ring.visible = real > 0.0005 && real < 0.9995; ring.position.y = cut;
  setFold(PR, fold);
  const open = 1 - fold;
  PR.rig.position.set(0, -H * open * 0.2, -H * open);
  PR.rig.rotation.y = rot;
  if (lastFold !== null) { if (lastFold > 0.95 && fold <= 0.95) send('sfx', { name: 'unfold' }); if (lastFold < 0.05 && fold >= 0.05) send('sfx', { name: 'fold' }); }
  if (lastReal !== null && ((lastReal < 0.02 && real >= 0.02) || (lastReal > 0.98 && real <= 0.98))) send('sfx', { name: 'scan' });
  lastFold = fold; lastReal = real;
  if ((mixTimer += dt) > 0.12) { mixTimer = 0; reportFaces(); }
  hero.object.visible = !tour.active;
  if (tour.active) tour.update(dt);
  else {
    director.update(dt, camera, controls.target);
    const dist = (15.5 + ease(open) * 13) * director.state.mul, dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, dist);
    controls.update();
  }
  for (const u of updaters) u(t);
  composer.render();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
